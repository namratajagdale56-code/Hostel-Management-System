<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Form | SGI Living Hub</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Poppins",sans-serif;
        }

        body{
            background:#fdecec;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        /* ---------------- PERFECT NAVBAR (EXACT SCREENSHOT STYLE) ---------------- */
        nav{
            width:100%;
            background:#ffffff;
            padding:14px 28px;               /* EXACT PADDING */
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:2px solid #dc2626;
            position:sticky;
            top:0;
            z-index:1000;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:12px;                         /* SAME GAP AS SCREENSHOT */
            font-size:24px;                   /* SAME FONT SIZE */
            font-weight:700;
            white-space:nowrap;
        }

        .logo img{
            height:48px;                      /* EXACT LOGO HEIGHT */
        }

        .sgi{ color:#dc2626; }
        .lh{ color:#000000; }

        .hamburger{
            font-size:34px;                   /* SAME ICON SIZE */
            color:#dc2626;
            background:none;
            border:none;
            cursor:pointer;
            padding:4px;
            display:none;                     /* SHOW only in mobile */
        }

        .nav-links{
            display:flex;
            gap:25px;                         /* PERFECT SPACING */
        }

        .nav-links a{
            text-decoration:none;
            color:#dc2626;
            font-size:18px;
            font-weight:600;
        }

        /* ---------------- MOBILE NAV ---------------- */
        @media(max-width:850px){

            .hamburger{ display:block; }

            .nav-links{
                display:none;
                flex-direction:column;
                background:white;
                position:absolute;
                top:75px;
                right:25px;
                width:65%;
                padding:18px;
                border-radius:12px;
                box-shadow:0 4px 15px rgba(0,0,0,0.2);
            }

            .nav-links.open{ display:flex; }

            .logo{
                font-size:20px;
                gap:8px;
            }

            .logo img{
                height:40px;                   /* mobile size */
            }
        }

        /* ---------------- FORM ---------------- */
        .container{
            width:90%;
            max-width:550px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 6px 15px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            font-size:26px;
            font-weight:700;
            color:#b91c1c;
            margin-bottom:15px;
        }

        label{
            font-weight:600;
            margin-top:12px;
            display:block;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-top:6px;
            border:1px solid #dc2626;
            border-radius:10px;
            font-size:16px;
        }

        button{
            width:100%;
            background:#dc2626;
            color:white;
            padding:12px;
            border:none;
            margin-top:20px;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            font-weight:700;
        }

        button:hover{
            background:#b91c1c;
        }

        footer{
            margin-top:auto;
            background:#b91c1c;
            color:white;
            text-align:center;
            padding:12px;
            font-size:15px;
        }
    </style>

    <script>
        function toggleMenu(){
            document.querySelector(".nav-links").classList.toggle("open");
        }
    </script>

</head>

<body>

<!-- ---------------- NAVBAR ---------------- -->
<nav>
    <div class="logo">
        <img src="{{ url_for('static', filename='image/l2.jpg') }}">
        <span class="sgi">SGI</span>
        <span class="lh">Living Hub</span>
    </div>

    <button class="hamburger" onclick="toggleMenu()">&#9776;</button>

    <div class="nav-links">
        <a href="{{ url_for('main.student_dashboard') }}">Dashboard</a>
    </div>
</nav>

<!-- ---------------- LEAVE FORM ---------------- -->
<div class="container">
    <h2>Leave Form</h2>

    <form method="POST">

        <label>From Date</label>
        <input type="date" name="from_date" required>

        <label>To Date</label>
        <input type="date" name="to_date" required>

        <label>Reason</label>
        <textarea name="reason" rows="5" required></textarea>

        <button type="submit">Submit Leave Request</button>
    </form>
</div>

<!-- ---------------- FOOTER ---------------- -->
<footer>
    © 2025 SGI Living Hub | Student Panel
</footer>

</body>
</html>
