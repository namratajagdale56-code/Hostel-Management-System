<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student | Admin Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #fdecec;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= NAVBAR ================= */
        nav {
            width: 100%;
            background: #ffffff;
            padding: 12px 20px;
            border-bottom: 2px solid #dc2626;

            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area img {
            height: 42px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
        }

        .sgi { color: #dc2626; }
        .hub { color: black; }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #dc2626;
            font-weight: 600;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #7a1a1a;
        }

        /* HAMBURGER */
        .hamburger {
            display: none;
            font-size: 30px;
            background: none;
            border: none;
            color: #dc2626;
            cursor: pointer;
        }

        /* ================= MOBILE NAV MENU ================= */
        @media(max-width: 850px) {

            .hamburger {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;

                position: absolute;
                top: 65px;
                right: 20px;

                width: 65%;
                background: rgba(255,255,255,0.95);
                padding: 15px;
                border-radius: 12px;
                box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            }

            .nav-links.open {
                display: flex;
            }

            .nav-links a {
                padding: 10px;
                font-size: 17px;
                width: 100%;
                text-align: left;
            }
        }

        /* ================= FORM CARD ================= */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0px 8px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #b91c1c;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
        }

        label {
            font-weight: 600;
            color: #7a1a1a;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 16px;
            border: 1px solid #d4a2a2;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border: 1px solid #b91c1c;
        }

        .btn-save {
            width: 100%;
            background: #1d4ed8;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            color: white;
            text-align: center;
            font-weight: 600;
            display: block;
            margin-bottom: 15px;
            text-decoration: none;
        }

        /* BACK BUTTON CENTER FIX */
        .back-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-back {
            width: 100%;
            background: #dc2626;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            color: white;
            text-align: center;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-save:hover,
        .btn-back:hover {
            opacity: .85;
        }

        /* ================= FOOTER ================= */
        footer {
            background: #b91c1c;
            color: white;
            text-align: center;
            padding: 14px 0;
            font-size: 14px;
            margin-top: auto;
        }

    </style>

    <script>
        function toggleMenu() {
            document.querySelector(".nav-links").classList.toggle("open");
        }
    </script>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav>
    <div class="logo-area">
        <img src="{{ url_for('static', filename='image/l2.jpg') }}">
        <div class="logo-text">
            <span class="sgi">SGI</span> <span class="hub">Living Hub</span>
        </div>
    </div>

    <button class="hamburger" onclick="toggleMenu()">☰</button>

    <div class="nav-links">
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin.manage_students') }}">Students</a>
        <a href="{{ url_for('admin.complaints') }}">Complaints</a>
    </div>
</nav>

<!-- ================= EDIT FORM ================= -->
<div class="container">
    <div class="card">

        <h2>Edit Student</h2>

        <form method="POST">

            <label>Full Name</label>
            <input type="text" name="full_name" value="{{ student.full_name }}" required>

            <label>PRN</label>
            <input type="text" name="prn" value="{{ student.prn }}" required>

            <label>Department</label>
            <input type="text" name="department" value="{{ student.department }}" required>

            <label>Year</label>
            <input type="text" name="year" value="{{ student.year }}" required>

            <label>Mobile</label>
            <input type="text" name="mobile" value="{{ student.mobile }}" required>

            <button class="btn-save" type="submit">Save Changes</button>

        </form>

        <!-- BACK BUTTON CENTERED -->
        <div class="back-wrapper">
            <a href="{{ url_for('admin.manage_students') }}" class="btn-back">Back</a>
        </div>

    </div>
</div>

<footer>© 2025 SGI Living Hub | Admin Panel</footer>

</body>
</html>
