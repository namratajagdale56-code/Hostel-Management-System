<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Room | Admin Panel</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Poppins", sans-serif; }

        body {
            background: #fae5e5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            background: #fff;
            padding: 14px 25px;
            border-bottom: 2px solid #dc2626;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-area img { height: 44px; }
        .logo-text { font-size: 22px; font-weight: 700; }
        .sgi { color: #dc2626; }
        .hub { color: #000; }

        .nav-links { display: flex; gap: 28px; }
        .nav-links a { color: #dc2626; font-weight: 600; text-decoration: none; }
        .nav-links a:hover { color: #a31212; }

        .hamburger {
            display: none; font-size: 32px; background: none; border: none;
            color: #dc2626; cursor: pointer;
        }

        @media (max-width: 850px) {
            .hamburger { display: block; }
            .nav-links {
                display: none; flex-direction: column; gap: 15px;
                background: white; padding: 20px; border-radius: 12px;
                position: absolute; right: 20px; top: 75px; width: 60%;
                box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            }
            .nav-links.open { display: flex; }
        }

        h1 {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #7a1a1a;
            margin: 25px auto;
        }

        .edit-card {
            width: 92%; max-width: 900px;
            background: #fff; padding: 25px;
            border-radius: 14px; margin: 10px auto 40px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        label { font-weight: 600; color: #7a1a1a; margin-bottom: 6px; display: block; }

        input, select {
            width: 100%; padding: 12px;
            border-radius: 8px; border: 1px solid #d6aaaa;
            margin-bottom: 18px; font-size: 15px;
        }

        .btn-save {
            width: 100%; padding: 12px;
            background: #dc2626; border: none;
            color: white; font-size: 16px; font-weight: 600;
            border-radius: 8px; cursor: pointer;
            transition: 0.2s;
        }
        .btn-save:hover { background: #b01c1c; }

        /* FOOTER FIXED TO BOTTOM ALWAYS */
        footer {
            margin-top: auto;
            padding: 16px;
            text-align: center;
            color: white;
            background: #b91c1c;
            font-size: 15px;
        }
    </style>

    <script>
        function toggleMenu(){
            document.querySelector(".nav-links").classList.toggle("open");
        }
    </script>
</head>
<body>

<nav>
    <div class="logo-area">
        <img src="{{ url_for('static', filename='image/l2.jpg') }}">
        <span class="logo-text"><span class="sgi">SGI</span> <span class="hub">Living Hub</span></span>
    </div>

    <button class="hamburger" onclick="toggleMenu()">☰</button>

    <div class="nav-links">
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin.manage_students') }}">Students</a>
        <a href="{{ url_for('admin.manage_rooms') }}">Rooms</a>
        <a href="{{ url_for('admin.complaints') }}">Complaints</a>
    </div>
</nav>

<h1>Edit Room</h1>

<div class="edit-card">
    <form method="POST">

        <label>Room Number</label>
        <input type="text" name="room_no" value="{{ room.room_no }}" required>

        <label>Capacity</label>
        <input type="number" name="capacity" value="{{ room.capacity }}" required>

        <label>Occupied</label>
        <input type="number" name="occupied" value="{{ room.occupied }}" required>

        <label>Floor</label>
        <select name="floor" required>
            <option value="G" {% if room.floor == "G" %}selected{% endif %}>Ground</option>
            <option value="1" {% if room.floor == "1" %}selected{% endif %}>1</option>
            <option value="2" {% if room.floor == "2" %}selected{% endif %}>2</option>
            <option value="3" {% if room.floor == "3" %}selected{% endif %}>3</option>
            <option value="4" {% if room.floor == "4" %}selected{% endif %}>4</option>
            <option value="5" {% if room.floor == "5" %}selected{% endif %}>5</option>
        </select>

        <label>Block</label>
        <select name="block" required>
            <option value="H3" {% if room.block == "H3" %}selected{% endif %}>H3</option>
            <option value="H4" {% if room.block == "H4" %}selected{% endif %}>H4</option>
        </select>

        <button type="submit" class="btn-save">Save Changes</button>

    </form>
</div>

<footer>© 2025 SGI Living Hub | Admin Panel</footer>

</body>
</html>
