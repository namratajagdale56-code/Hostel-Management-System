<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SGI Hostel Gallery</title>

  <style>
    :root {
      --bg: #fdecec;
      --accent: #b91c1c;
      --shadow: 0 6px 12px rgba(0,0,0,0.12);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------------- NAVBAR ---------------- */
    nav {
      width: 100%;
      background: #fff;
      padding: 14px 25px;
      border-bottom: 2px solid #dc2626;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      display:flex;
      align-items:center;
      gap:10px;
      font-size:22px;
      font-weight:700;
    }
    .logo img { height:42px; }

    .nav-links {
      display:flex;
      gap:25px;
    }

    .nav-links a {
      text-decoration:none;
      color:#dc2626;
      font-weight:600;
      padding:6px 10px;
      border-radius:6px;
      transition:0.25s;
    }

    .nav-links a:hover {
      background:#dc2626;
      color:white;
    }

    .hamburger {
      display:none;
      font-size:32px;
      background:none;
      border:none;
      cursor:pointer;
      color:#dc2626;
    }

    /* ---------------- MOBILE NAV ---------------- */
    @media (max-width:850px) {
      .hamburger { display:block; }

      .nav-links {
        display:none;
        position:absolute;
        right:20px;
        top:70px;
        background:white;
        flex-direction:column;
        width:60%;
        padding:20px;
        border-radius:12px;
        box-shadow:0 8px 20px rgba(0,0,0,0.15);
        animation: fadeDrop 0.3s ease;
      }

      .nav-links a {
        padding:10px 0;
        font-size:16px;
      }

      .nav-links.open { display:flex; }
    }

    @keyframes fadeDrop {
      from { opacity:0; transform:translateY(-8px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ---------------- GALLERY ---------------- */
    .gallery-grid {
      width: 95%;
      max-width:1200px;
      margin:40px auto;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:22px;
    }

    /* Tablet */
    @media (max-width:992px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Mobile */
    @media (max-width:550px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    .gallery-item {
      border-radius:12px;
      overflow:hidden;
      height:210px;
      background:white;
      box-shadow:var(--shadow);
      cursor:pointer;
      transition:0.25s;
    }

    .gallery-item img {
      width:100%;
      height:100%;
      object-fit:cover;
      transition:0.3s;
    }

    .gallery-item:hover { transform:scale(1.03); }
    .gallery-item:hover img { transform:scale(1.08); }

    /* ---------------- IMAGE POPUP ---------------- */
    .popup {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.85);
      backdrop-filter:blur(4px);
      justify-content:center;
      align-items:center;
      z-index:2000;
    }

    .popup img {
      max-width:90%;
      max-height:90%;
      border-radius:10px;
      box-shadow:0 0 20px rgba(255,255,255,0.2);
      animation: zoomIn 0.25s ease;
    }

    .close-btn {
      position:absolute;
      top:25px;
      right:25px;
      font-size:35px;
      color:white;
      cursor:pointer;
      font-weight:700;
    }

    @keyframes zoomIn {
      from { transform:scale(0.7); opacity:0; }
      to   { transform:scale(1); opacity:1; }
    }

    /* ---------------- FOOTER ---------------- */
    footer {
      background:#b91c1c;
      color:white;
      padding:15px;
      text-align:center;
      margin-top:auto;
    }
  </style>

  <script>
    function toggleMenu() {
      document.querySelector(".nav-links").classList.toggle("open");
    }

    // IMAGE POPUP FUNCTION
    function openPopup(src) {
      document.getElementById("popupImg").src = src;
      document.getElementById("imgPopup").style.display = "flex";
    }

    function closePopup() {
      document.getElementById("imgPopup").style.display = "none";
    }
  </script>

</head>

<body>

<!-- ---------------- NAVBAR ---------------- -->
<nav>
  <div class="logo">
    <img src="{{ url_for('static', filename='image/l2.jpg') }}">
    <span style="color:#dc2626;">SGI</span>
    <span>Living Hub</span>
  </div>

  <button class="hamburger" onclick="toggleMenu()">☰</button>

  <div class="nav-links">
      <a href="{{ url_for('main.home') }}">Home</a>
      <a href="{{ url_for('main.about') }}">About</a>
      <a href="{{ url_for('main.contact') }}">Contact</a>
      <a href="{{ url_for('main.login') }}">Login</a>
      <a href="{{ url_for('main.register') }}">Register</a>
  </div>
</nav>


<!-- ---------------- GALLERY ---------------- -->
<div class="gallery-grid">
  {% for i in range(1,25) %}
  <div class="gallery-item">
    <img src="{{ url_for('static', filename='image/h' ~ i ~ '.jpg') }}" onclick="openPopup(this.src)">
  </div>
  {% endfor %}
</div>


<!-- ---------------- POPUP ---------------- -->
<div id="imgPopup" class="popup">
  <span class="close-btn" onclick="closePopup()">✕</span>
  <img id="popupImg">
</div>


<!-- ---------------- FOOTER ---------------- -->
<footer>
  © 2025 SGI Living Hub
</footer>

</body>
</html>
